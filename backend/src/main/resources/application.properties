spring.application.name=book-recommendation

# Personal settings (database password) live in application-local.properties, which is NOT committed.
# Copy application-local.properties.example to application-local.properties and edit it.
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
